[project]
name = "lifelink-backend"
version = "1.0.0"
description = "LifeLink API - Emergency response and coordination platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "geoalchemy2>=0.21.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
# Tell Vercel's Python builder where the ASGI app lives when this directory is
# deployed as a service (the app is inside the `app` package, not at the root).
entrypoint = "app.main:app"
